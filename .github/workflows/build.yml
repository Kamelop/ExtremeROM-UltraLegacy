name: Build ArtisanROM 9810

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [STARLTE, STAR2LTE, CROWNLTE, R7N]

    steps:

      - name: Current time
        run: date

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
            curl xxd patchelf flex bison libarchive-tools build-essential lz4
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Build dependencies
        run: source ./buildenv.sh ${{ matrix.target }}

      - name: Download source firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          TARGET_FIRMWARE="$SOURCE_FIRMWARE" ./scripts/download_fw.sh --force

      - name: Extract source firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          TARGET_FIRMWARE="$SOURCE_FIRMWARE" ./scripts/extract_fw.sh --force

      - name: Download target firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          SOURCE_FIRMWARE="$TARGET_FIRMWARE" ./scripts/download_fw.sh --force

      - name: Extract target firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          SOURCE_FIRMWARE="$TARGET_FIRMWARE" ./scripts/extract_fw.sh --force

      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh --force

      - name: Find .tar.md5 file
        id: find_tar
        run: |
          TAR_FILE=$(find out -maxdepth 1 -type f -name "ArtisanROM*.tar.md5" | head -n 1)
          echo "tar_path=$TAR_FILE" >> $GITHUB_OUTPUT

      - name: Extract .img.lz4 from tar.md5 and decompress
        run: |
          mkdir -p out/extracted
          tar -xf "${{ steps.find_tar.outputs.tar_path }}" -C out/extracted \
            system.img.lz4 vendor.img.lz4 odm.img.lz4 || true

          cd out/extracted
          for file in *.img.lz4; do
            echo "Decompressing $file..."
            lz4 -d "$file" "${file%.lz4}"
          done

      - name: Upload extracted .img files to GoFile
        run: |
          for IMG in out/extracted/*.img; do
            echo "Uploading $IMG to GoFile..."
            RESPONSE=$(curl -s -F "file=@$IMG" \
              -F "token=${{ secrets.GOFILE_TOKEN }}" \
              -F "folderId=${{ secrets.GOFILE_FOLDER_ID_${{ matrix.target }} }}" \
              "https://upload.gofile.io/uploadFile")

            LINK=$(echo "$RESPONSE" | jq -r '.data.downloadPage')
            echo "✅ Uploaded: $IMG"
            echo "🔗 Download: $LINK"
          done
